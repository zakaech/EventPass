# Nginx dans le conteneur frontend : sert le build React et relaie l'API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte (JS, CSS, JSON…)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off; # ne pas afficher la version de Nginx

    # API : relayée vers le conteneur backend (nom du service docker-compose).
    # Même origine pour le navigateur → ni CORS, ni contenu mixte.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        # Vraie IP du client, lue par Express grâce à TRUST_PROXY=1 (limite de connexions)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers produits par Vite : leur nom contient une empreinte du contenu
    # (index-DpN-JKZJ.js), ils peuvent donc être mis en cache « pour toujours ».
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application à page unique (SPA) : /mes-billets n'existe pas sur le disque, c'est
    # React Router qui gère cette URL dans le navigateur. Pour toute URL qui n'est pas un
    # fichier, on renvoie index.html (sinon un rafraîchissement donnerait une erreur 404).
    location / {
        try_files $uri $uri/ /index.html;
        # index.html ne doit pas être mis en cache : il référence les fichiers du dernier build
        add_header Cache-Control "no-cache";
    }
}
