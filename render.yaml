# Blueprint Render : décrit le service de l'API « en tant que code ».
# Render → New → Blueprint → ce dépôt : le service est créé avec cette configuration.
# Guide complet : docs/DEPLOIEMENT.md
services:
  - type: web
    name: eventpass-api
    runtime: docker # Render construit l'image à partir de backend/Dockerfile
    plan: free
    region: frankfurt # même région que la base Neon (AWS eu-central-1) : latence minimale
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render vérifie cette URL avant de basculer le trafic sur une nouvelle version
    healthCheckPath: /api/v1/health
    # Ne redéployer que si le backend change (pas pour une modification du frontend ou de la doc)
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/tests/**
        - backend/requests/**
    envVars:
      - key: NODE_ENV
        value: production
      # Valeurs secrètes ou propres à votre déploiement : demandées par Render à la création
      # du Blueprint (sync: false = jamais écrites dans ce fichier)
      - key: DATABASE_URL # chaîne de connexion Neon (voir le guide)
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: CORS_ORIGIN # URL du frontend Vercel, ex. https://eventpass.vercel.app
        sync: false
      # Render place un proxy devant l'API : on lit la vraie IP du client (limite de connexions)
      - key: TRUST_PROXY
        value: "1"
      # Démo publique : données remises à neuf à chaque démarrage (le service gratuit
      # redémarre après chaque mise en veille) et admin de démo en lecture seule
      - key: DEMO_RESET_ON_START
        value: "true"
      - key: READ_ONLY_EMAILS
        value: admin@eventpass.dev
      - key: JWT_EXPIRES_IN
        value: 2h
